[production]
phpSettings.display_startup_errors = 1
phpSettings.display_errors = 1
phpSettings.error_reporting = E_All
bootstrap.path = APPLICATION_PATH "/modules/default/Bootstrap.php"
includePaths.library = APPLICATION_PATH "/modules/default/library"	
bootstrap.class = "Default_Bootstrap"
appnamespace= "Default"
    
phpSettings.max_execution_time=0
autoloaderNamespaces[] ="Login_"
autoloaderNamespaces[] ="sapp_"
autoloaderNamespaces[] ="HTMLPurifier"

resources.frontController.params.displayExceptions = 0
resources.frontController.defaultModule = "default"
resources.frontController.params.prefixDefaultModule = "1"
resources.modules[]=
resources.frontController.moduleDirectory = APPLICATION_PATH "/modules"
resources.frontController.plugins[] = "Default_Plugin_SecurityCheck"
resources.layout.layout = "layout"
resources.layout.layoutPath = APPLICATION_PATH "/layouts/scripts/"
resources.frontController.plugins.accessControl = "Default_Plugin_AccessControl"


auth.salt= "xcNsdaAd73328aDs73oQw223hd"
auth.timeout= 60

resources.db.adapter = PDO_MYSQL
resources.db.params.host = SENTRIFUGO_HOST
resources.db.params.username = SENTRIFUGO_USERNAME
resources.db.params.password = SENTRIFUGO_PASSWORD
resources.db.params.dbname = SENTRIFUGO_DBNAME
resources.db.params.port = SENTRIFUGO_PORT
resources.db.isDefaultTableAdapter = true

 
; ========================================================================
; Active Directory Configuration for Sentrifugo HRM
; ========================================================================

; Connection Details
ldap.server1.host = "ldaps://glhqserver.gloriousplc.net"
ldap.server1.port = 636
ldap.server1.useStartTls = 0
ldap.server1.bindRequiresDn = 1

; Domain Information (Required for NetBIOS username format)
ldap.server1.accountDomainName = "gloriousplc.net"
ldap.server1.accountDomainNameShort = "gloriousplc"
ldap.server1.accountCanonicalForm = 2

; Base for user searches
ldap.server1.baseDn = "CN=Users,DC=gloriousplc,DC=net"

; Explicit Active Directory Filter (Overrides OpenLDAP defaults)
ldap.server1.accountFilterFormat = "(&(sAMAccountName=%s)(objectClass=user))"

; Service Account Credentials (For the application to search the directory)
ldap.server1.username = "CN=sentrifugo,CN=Users,DC=gloriousplc,DC=net"
ldap.server1.password = "#strfgo_bind_VAR365$"


; ========================================================================
; Manual Cache Configuration (SSOT-Compliant Upgrade)
; ========================================================================
cache.frontend.name = "Core"
cache.frontend.options.lifetime = 7200
cache.frontend.options.automatic_serialization = true
cache.backend.name = "File"
cache.backend.options.cache_dir = APPLICATION_PATH "/../data/cache"


[staging : production]

[testing : production]
phpSettings.display_startup_errors = 1
phpSettings.display_errors = 1

[development : production]
phpSettings.display_startup_errors = 1
phpSettings.display_errors = 1
resources.frontController.params.displayExceptions = 0


resources.log.stream.writerName = "Stream"
resources.log.stream.writerParams.stream = APPLICATION_PATH "/../logs/application.log"

resources.log.stream.writerParams.mode = "a"
resources.log.stream.filterName = "Priority"
resources.log.stream.formatterName = "Simple"
resources.log.stream.filterParams.priority = 7
resources.log.stream.formatterParams.format = "%timestamp% %priorityName% (%priority%): %message% %info%"

phpSettings.error_reporting = E_ALL
phpSettings.log_errors = 1
phpSettings.error_log = APPLICATION_PATH "/../logs/application.log"

