name: Deploy Sentrifugo Demo

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/sentrifugo
            # Fetch only the single latest commit (ignores past history bloat completely)
            sudo git fetch --depth=1 origin main
            sudo git reset --hard origin/main
            
            # Run the clean restore with the new compressed database
            sudo /home/ubuntu/reset_demo_db.sh

            sudo chown -R www-data:www-data /var/www/html/sentrifugo
            sudo chmod -R 775 /var/www/html/sentrifugo/data /var/www/html/sentrifugo/logs /var/www/html/sentrifugo/public/uploads